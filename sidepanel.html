<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Figma CSS Compare</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="header">
        <h3>CSS Comparison</h3>
        <button id="settingsBtn" class="icon-btn" title="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </div>

    <div class="form-group">
        <h4>🎯 Step 1: Select Website Element</h4>
        <button id="selectElement">Select Element</button>
    </div>

    <div class="form-group">
        <h4>📋 Step 2: Paste Figma CSS Code</h4>
        <textarea id="figmaCss" placeholder="Paste your Figma CSS code here..."></textarea>
    </div>

    <div class="button-group">
        <button id="compareBtn">✓ Compare CSS</button>
        <button id="clearData">🗑️ Clear</button>
    </div>

    <div class="results-section">
        <div class="results-header" id="resultsHeader" style="display: none;">
            <h5 id="resultsTitle">📊 Selected Element CSS</h5>
        </div>
        <div id="results"></div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Settings</h5>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <span>Dark Mode</span>
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider round"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
